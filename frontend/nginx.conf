map $http_x_forwarded_for $trusted_client_ip {
    default $remote_addr;
    "~^[0-9A-Fa-f:.]{2,45}$" $http_x_forwarded_for;
}

server {
    listen 8080 default_server;
    listen [::]:8080 default_server;
    server_name _;
    server_tokens off;

    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 64k;

    add_header Content-Security-Policy "default-src 'self'; base-uri 'none'; connect-src 'self'; font-src 'self'; form-action 'self'; frame-ancestors 'none'; img-src 'self' data:; object-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'" always;
    add_header Referrer-Policy "same-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Permissions-Policy "camera=(), geolocation=(), microphone=()" always;

    location = /healthz {
        access_log off;
        return 204;
    }

    location = /actuator/health {
        proxy_pass http://backend:8080;
        include /etc/nginx/proxy_params;
        proxy_read_timeout 5s;
    }

    location = /api/v1/events {
        proxy_pass http://backend:8080;
        include /etc/nginx/proxy_params;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 370s;
    }

    location /api/ {
        proxy_pass http://backend:8080;
        include /etc/nginx/proxy_params;
        proxy_read_timeout 35s;
    }

    location /assets/ {
        try_files $uri =404;
        expires 1y;
    }

    location = /index.html {
        expires -1;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
