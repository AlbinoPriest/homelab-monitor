name: homelab-monitor

services:
  frontend:
    build:
      context: ./frontend
    ports:
      - "${APP_BIND_ADDRESS:-127.0.0.1}:${APP_PORT:-8080}:8080"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - edge
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--spider", "http://127.0.0.1:8080/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    init: true
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 128m
    cpus: 0.50
    pids_limit: 100
    restart: unless-stopped
    stop_grace_period: 10s

  backend:
    build:
      context: ./backend
    environment:
      SPRING_PROFILES_ACTIVE: prod
      POSTGRES_HOST: postgres
      POSTGRES_DB: ${POSTGRES_DB:-homelab_monitor}
      POSTGRES_USER: ${APP_DB_USER:-homelab_app}
      POSTGRES_PASSWORD: ${APP_DB_PASSWORD:?Set APP_DB_PASSWORD in .env before starting production}
      SESSION_TIMEOUT: ${SESSION_TIMEOUT:-30m}
      RAW_CHECK_RETENTION_ENABLED: ${RAW_CHECK_RETENTION_ENABLED:-true}
      RAW_CHECK_RETENTION_DAYS: ${RAW_CHECK_RETENTION_DAYS:-30}
      RAW_CHECK_RETENTION_BATCH_SIZE: ${RAW_CHECK_RETENTION_BATCH_SIZE:-1000}
      RAW_CHECK_RETENTION_MAX_BATCHES_PER_RUN: ${RAW_CHECK_RETENTION_MAX_BATCHES_PER_RUN:-2}
      RAW_CHECK_RETENTION_INITIAL_DELAY: ${RAW_CHECK_RETENTION_INITIAL_DELAY:-60000}
      RAW_CHECK_RETENTION_CLEANUP_DELAY: ${RAW_CHECK_RETENTION_CLEANUP_DELAY:-60000}
      SSE_MAX_CONNECTIONS: ${SSE_MAX_CONNECTIONS:-8}
      SSE_CONNECTION_TIMEOUT: ${SSE_CONNECTION_TIMEOUT:-300000}
      SSE_HEARTBEAT_DELAY: ${SSE_HEARTBEAT_DELAY:-15000}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - edge
      - data
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--spider", "http://127.0.0.1:8080/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    init: true
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 768m
    cpus: 1.50
    pids_limit: 256
    restart: unless-stopped
    stop_grace_period: 80s

  postgres:
    image: postgres:17.11-alpine@sha256:5d61573b31c206ae538c85893edeb6e320e1a9ffd838c0f9dca927fb6f765fa4
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-homelab_monitor}
      POSTGRES_USER: ${POSTGRES_ADMIN_USER:-homelab_admin}
      POSTGRES_PASSWORD: ${POSTGRES_ADMIN_PASSWORD:?Set POSTGRES_ADMIN_PASSWORD in .env before starting production}
      APP_DB_USER: ${APP_DB_USER:-homelab_app}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:?Set APP_DB_PASSWORD in .env before starting production}
    networks:
      - data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./scripts/postgres-init-app-role.sh:/docker-entrypoint-initdb.d/10-create-app-role.sh:ro
    shm_size: 128m
    security_opt:
      - no-new-privileges:true
    mem_limit: 512m
    cpus: 1.00
    pids_limit: 200
    restart: unless-stopped
    stop_grace_period: 60s

networks:
  edge:
  data:
    internal: true

volumes:
  postgres-data:
