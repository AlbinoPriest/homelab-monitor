name: homelab-monitor-dev

services:
  postgres:
    image: postgres:17.11-alpine@sha256:5d61573b31c206ae538c85893edeb6e320e1a9ffd838c0f9dca927fb6f765fa4
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-homelab_monitor}
      POSTGRES_USER: ${POSTGRES_USER:-homelab_monitor}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-homelab_monitor_dev}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s
    volumes:
      - postgres-dev-data:/var/lib/postgresql/data
    restart: unless-stopped
    stop_grace_period: 30s

volumes:
  postgres-dev-data:
