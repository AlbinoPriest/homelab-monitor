spring:
  application:
    name: HomeLab Monitor
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:homelab_monitor}
    username: ${POSTGRES_USER:homelab_monitor}
    password: ${POSTGRES_PASSWORD:homelab_monitor_dev}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never

springdoc:
  api-docs:
    enabled: false

server:
  address: ${SERVER_ADDRESS:127.0.0.1}
  servlet:
    session:
      timeout: ${SESSION_TIMEOUT:30m}
      cookie:
        http-only: true
        same-site: lax
        secure: ${SESSION_COOKIE_SECURE:false}

homelab-monitor:
  security:
    allowed-hosts: "${ALLOWED_HOSTS:localhost,127.0.0.1,[::1]}"
    trust-proxy-headers: ${TRUST_PROXY_HEADERS:false}
  scheduling:
    scan-delay: 1000
  retention:
    enabled: ${RAW_CHECK_RETENTION_ENABLED:true}
    raw-check-days: ${RAW_CHECK_RETENTION_DAYS:30}
    batch-size: ${RAW_CHECK_RETENTION_BATCH_SIZE:1000}
    max-batches-per-run: ${RAW_CHECK_RETENTION_MAX_BATCHES_PER_RUN:2}
    initial-delay: ${RAW_CHECK_RETENTION_INITIAL_DELAY:60000}
    cleanup-delay: ${RAW_CHECK_RETENTION_CLEANUP_DELAY:60000}
  realtime:
    max-connections: ${SSE_MAX_CONNECTIONS:8}
    connection-timeout: ${SSE_CONNECTION_TIMEOUT:300000}
    heartbeat-delay: ${SSE_HEARTBEAT_DELAY:15000}
